<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Architectural Background -->
  <rect width="800" height="600" fill="#EAEAE2"/>
  
  <!-- Subtle Ceiling Grid Lines -->
  <line x1="50" y1="80" x2="750" y2="80" stroke="#254C38" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="100" y1="120" x2="700" y2="120" stroke="#254C38" stroke-opacity="0.3" stroke-width="2.5"/>
  <line x1="150" y1="160" x2="650" y2="160" stroke="#254C38" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Perspective Ceiling Frame -->
  <polygon points="100,120 700,120 780,20 20,20" fill="#254C38" fill-opacity="0.08"/>
  <polygon points="100,120 700,120 620,260 180,260" fill="#254C38" fill-opacity="0.12"/>
  <polygon points="180,260 620,260 560,340 240,340" fill="#254C38" fill-opacity="0.05"/>

  <!-- Architectural Spatial Lines -->
  <line x1="180" y1="260" x2="180" y2="520" stroke="#254C38" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="620" y1="260" x2="620" y2="520" stroke="#254C38" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="180" y1="520" x2="620" y2="520" stroke="#254C38" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Center Quality Seal / Handover Icon -->
  <circle cx="400" cy="260" r="64" fill="#254C38"/>
  <circle cx="400" cy="260" r="56" fill="none" stroke="#F7F7F2" stroke-width="2" stroke-dasharray="6 4"/>
  
  <!-- Checkmark / Handover Stamp -->
  <path d="M380 260 L395 275 L425 245" stroke="#F7F7F2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Typography: Handover Verification -->
  <text x="400" y="375" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#252925" letter-spacing="2">
    PROJECT HANDOVER &amp; SIGN-OFF
  </text>
  <text x="400" y="405" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#5E645E" letter-spacing="1">
    FLAWLESS TENSION INSPECTION • 10-YEAR WARRANTY ACTIVATION
  </text>

  <!-- Clear Placeholder Notice Tag as explicitly required by prompt -->
  <rect x="230" y="440" width="340" height="36" rx="18" fill="#254C38" fill-opacity="0.1" stroke="#254C38" stroke-opacity="0.3"/>
  <text x="400" y="463" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#254C38">
    [ STEP 04 ASSET • PENDING FINAL PROJECT PHOTO ]
  </text>
</svg>
